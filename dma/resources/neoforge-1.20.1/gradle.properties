org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## 让 Gradle 直接复用本机已安装的 JDK。createMinecraftArtifacts 需要
## Java 21，自动探测扫不到自定义安装目录时会去 foojay 下载，失败后只报
## “找不到 Java 21”。这里把本机所有 JDK 明确告诉它。
org.gradle.java.installations.paths={{java_homes}}

## Minecraft / NeoForge
# 1.20.1 的构件是 net.neoforged:forge:1.20.1-<neo_version>，
# 由 build.gradle 里的 legacyForge.neoForgeVersion 拼出来。
minecraft_version={{mc_version}}
minecraft_version_range=[1.20.1,1.21)
neo_version=47.1.106
neo_version_range=[47,)
loader_version_range=[47,)

## Mod
mod_id={{mod_id}}
mod_name={{mod_name}}
mod_license=All Rights Reserved
mod_version={{mod_version}}
mod_group_id={{package}}
mod_authors=Developer
mod_description=Created with Darkitten Mod Agent.
